name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build generated Basic template
        run: |
          cargo run -- new slintx-ci-basic --path target/slintx-ci-basic-${{ github.run_id }}-${{ github.run_attempt }} --vcs none
          cargo check --manifest-path target/slintx-ci-basic-${{ github.run_id }}-${{ github.run_attempt }}/Cargo.toml
      - name: Build generated Workspace template
        run: |
          cargo run -- new slintx-ci-workspace --template workspace --path target/slintx-ci-workspace-${{ github.run_id }}-${{ github.run_attempt }} --vcs none
          cargo check --manifest-path target/slintx-ci-workspace-${{ github.run_id }}-${{ github.run_attempt }}/Cargo.toml --workspace
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked
