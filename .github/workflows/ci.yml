name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build generated Basic template
        run: |
          cargo run -- new slintx-ci-basic --path target/slintx-ci-basic --vcs none
          cargo check --manifest-path target/slintx-ci-basic/Cargo.toml
      - name: Build generated Workspace template
        run: |
          cargo run -- new slintx-ci-workspace --template workspace --path target/slintx-ci-workspace --vcs none
          cargo check --manifest-path target/slintx-ci-workspace/Cargo.toml --workspace
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked
